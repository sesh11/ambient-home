[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-home"
version = "0.1.0"
description = "Ambient voice assistant hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ambient-device-sdk",
    "garage-sdk",
    "openai>=3.12.0,<4",
    "websockets>=13,<16",
    "openwakeword",
    "onnxruntime",
    "numpy",
    "httpx",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.15.20",
    "mypy==2.2.0",
    "pre-commit",
]

[project.scripts]
ambient-home = "ambient_home.main:main"
ambient-install-service = "ambient_home.service:install_main"
ambient-uninstall-service = "ambient_home.service:uninstall_main"

[tool.uv.workspace]
members = ["packages/ambient-device-sdk"]

[tool.uv.sources]
ambient-device-sdk = { workspace = true }
garage-sdk = { git = "https://github.com/sesh11/garage.git", rev = "de0dd204724a195a20abd061e6c2dbf3e4c68df3", subdirectory = "packages/garage-sdk" }

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ambient_home = ["models/*.onnx", "profiles/**/*.md", "ui/index.html", "launchd/*.plist"]

[tool.ruff]
line-length = 119
exclude = [".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "D"]
ignore = ["E501", "D100", "D203", "D213"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = ["standard-library", "local-folder"]
known-local-folder = ["ambient_home", "ambient_device_sdk"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"packages/ambient-device-sdk/tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["src/", "packages/ambient-device-sdk/src/", "packages/ambient-device-sdk/tests/"]
ignore_missing_imports = true
allow_subclassing_any = true
strict = true
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/ambient-device-sdk/tests"]
