<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ambient-home</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
    header { align-items: center; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; }
    nav { display: flex; gap: 1rem; }
    nav a { border-bottom: 2px solid transparent; color: #444; padding-bottom: .2rem; text-decoration: none; }
    nav a.active { border-bottom-color: #198754; color: #111; font-weight: 600; }
    .badge { border-radius: 999px; color: white; padding: .25rem .75rem; }
    .asleep { background: #555; } .live { background: #198754; }
    button { cursor: pointer; } table { border-collapse: collapse; table-layout: fixed; margin-top: 1rem; width: 100%; }
    td, th { border-bottom: 1px solid #ddd; padding: .6rem; text-align: left; vertical-align: top; }
    th:nth-child(1), td.request { max-width: 40ch; overflow-wrap: anywhere; word-break: break-word; width: 40%; }
    th:nth-child(2), td.status { width: 12%; }
    th:nth-child(3), td.acu { width: 8%; }
    th:nth-child(4), td.pr { width: 12%; }
    th:nth-child(5), td.question { width: 28%; }
    .danger { background: #b42318; border: 0; color: white; padding: .5rem .75rem; }
    input { max-width: 18rem; padding: .4rem; width: calc(100% - 5rem); }
    .meta { color: #666; font-size: .9rem; }
    .chart { position: relative; }
    .history { align-items: flex-end; display: flex; gap: .5rem; height: 8rem; margin-top: 1rem; }
    .history > div { border-radius: 2px; cursor: default; display: flex; flex: 1; flex-direction: column; height: 100%; justify-content: flex-end; text-align: center; }
    .history > div.hover { background: #f1f5f9; }
    .history .bar { background: #198754; min-height: 1px; }
    .history .bar.acu { background: #3b82f6; border-radius: 2px 2px 0 0; }
    .history .day { color: #666; font-size: .7rem; padding-top: .25rem; }
    #tooltip { background: #111; border-radius: 4px; color: white; display: none; font-size: .8rem; line-height: 1.4; padding: .4rem .6rem; pointer-events: none; position: absolute; transform: translate(-50%, -100%); white-space: nowrap; z-index: 1; }
    .legend { color: #666; font-size: .8rem; }
    .swatch { border-radius: 2px; display: inline-block; height: .6rem; width: .6rem; }
    .swatch.live { background: #198754; } .swatch.acu { background: #3b82f6; }
  </style>
</head>
<body>
  <header>
    <h1>ambient-home</h1>
    <nav>
      <a id="nav-jobs" href="#/jobs">Job board</a>
      <a id="nav-costs" href="#/costs">Cost tracking</a>
    </nav>
    <div>
      <span id="state" class="badge asleep">ASLEEP</span>
      <button class="danger" onclick="stopSession()">Stop session</button>
    </div>
  </header>
  <p class="meta" id="session-meta">Session: 0s</p>
  <section id="page-jobs">
    <h2>Job board</h2>
    <table>
      <thead><tr><th>Request</th><th>Status</th><th>ACU</th><th>PR</th><th>Question</th></tr></thead>
      <tbody id="jobs"></tbody>
    </table>
  </section>
  <section id="page-costs" hidden>
    <h2>Cost tracking</h2>
    <p id="cost-total"></p>
    <p class="meta" id="live-budget"></p>
    <div class="chart">
      <div class="history" id="history"></div>
      <div id="tooltip"></div>
    </div>
    <p class="legend"><span class="swatch live"></span> Live audio $ · <span class="swatch acu"></span> worker ACU $ · estimates from local rates</p>
  </section>
  <script>
    const PAGES = ["jobs", "costs"];
    function currentPage() {
      const name = (location.hash.replace("#/", "") || "").trim();
      return PAGES.includes(name) ? name : "jobs";
    }
    function renderNav() {
      const page = currentPage();
      PAGES.forEach(name => {
        document.getElementById("page-" + name).hidden = name !== page;
        document.getElementById("nav-" + name).className = name === page ? "active" : "";
      });
    }
    async function stopSession() {
      await fetch("/api/stop", { method: "POST" });
      await refresh();
    }
    async function answer(id) {
      const input = document.getElementById("answer-" + id);
      const answerText = input.value.trim();
      if (!answerText) {
        return;
      }
      const send = document.getElementById("send-" + id);
      send.disabled = true;
      await fetch("/api/jobs/" + encodeURIComponent(id) + "/answer", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({answer: answerText})
      });
      input.value = "";
      await refresh();
    }
    function createJobRow(job) {
      const row = document.createElement("tr");
      row.dataset.jobId = job.id;
      row.innerHTML =
        '<td class="request"></td><td class="status"></td><td class="acu"></td><td class="pr"></td>' +
        '<td class="question"><span class="question-text"></span>' +
        '<div class="answer-controls"><input id="answer-' + job.id +
        '" placeholder="Answer"><button id="send-' + job.id + '">Send</button></div></td>';
      const input = row.querySelector("input");
      const send = row.querySelector("button");
      input.addEventListener("input", () => {
        send.disabled = !input.value.trim();
      });
      send.addEventListener("click", () => answer(job.id));
      return row;
    }
    function updateJobRow(row, job) {
      row.querySelector(".request").textContent = job.request;
      row.querySelector(".status").textContent = job.status;
      row.querySelector(".acu").textContent =
        job.acus_consumed === null || job.acus_consumed === undefined ? "" : job.acus_consumed.toFixed(2);
      const pr = row.querySelector(".pr");
      pr.replaceChildren();
      if (job.pr_url) {
        const link = document.createElement("a");
        link.href = job.pr_url;
        link.target = "_blank";
        link.textContent = "PR";
        pr.appendChild(link);
      }
      row.querySelector(".question-text").textContent = job.question || job.error || "";
      const controls = row.querySelector(".answer-controls");
      controls.hidden = job.status !== "blocked";
      const input = row.querySelector("input");
      const send = row.querySelector("button");
      send.disabled = !input.value.trim();
    }
    function tooltipText(day) {
      return [
        day.date,
        "Live audio: " + day.live_minutes.toFixed(1) + " min · $" + day.live_usd.toFixed(2),
        "Worker ACUs: " + day.acus.toFixed(2) + " · $" + day.acu_usd.toFixed(2),
        "Total: $" + day.usd.toFixed(2)
      ].join("\n");
    }
    function showTooltip(column, day) {
      const tooltip = document.getElementById("tooltip");
      const chart = column.closest(".chart").getBoundingClientRect();
      const box = column.getBoundingClientRect();
      tooltip.textContent = tooltipText(day);
      tooltip.style.whiteSpace = "pre";
      tooltip.style.display = "block";
      tooltip.style.left = (box.left - chart.left + box.width / 2) + "px";
      tooltip.style.top = (box.top - chart.top - 8) + "px";
      column.classList.add("hover");
    }
    function hideTooltip(column) {
      document.getElementById("tooltip").style.display = "none";
      if (column) {
        column.classList.remove("hover");
      }
    }
    function renderHistory(history) {
      const container = document.getElementById("history");
      container.replaceChildren();
      hideTooltip();
      const peak = Math.max(0.01, ...history.map(day => day.usd));
      history.forEach(day => {
        const column = document.createElement("div");
        column.tabIndex = 0;
        column.setAttribute("aria-label", tooltipText(day).replace(/\n/g, ", "));
        const acu = document.createElement("div");
        acu.className = "bar acu";
        acu.style.height = (day.acu_usd / peak * 100).toFixed(1) + "%";
        const live = document.createElement("div");
        live.className = "bar";
        live.style.height = (day.live_usd / peak * 100).toFixed(1) + "%";
        const label = document.createElement("div");
        label.className = "day";
        label.textContent = day.date.slice(5);
        column.append(acu, live, label);
        column.addEventListener("mouseenter", () => showTooltip(column, day));
        column.addEventListener("focus", () => showTooltip(column, day));
        column.addEventListener("mouseleave", () => hideTooltip(column));
        column.addEventListener("blur", () => hideTooltip(column));
        container.appendChild(column);
      });
    }
    function renderCosts(costs) {
      const today = costs.today;
      document.getElementById("cost-total").textContent =
        "Today: " + today.live_minutes.toFixed(1) + " Live minutes, " + today.acus.toFixed(2) +
        " ACUs · $" + today.usd.toFixed(2) + " · last " + costs.history.length + " days: $" +
        costs.window_usd.toFixed(2);
      renderHistory(costs.history);
    }
    function renderLive(live) {
      const badge = document.getElementById("state");
      badge.textContent = live.state.toUpperCase();
      badge.className = "badge " + (live.state === "live" ? "live" : "asleep");
      document.getElementById("session-meta").textContent =
        "Session: " + Math.round(live.session_elapsed_s) + "s";
      const budget = (live.seconds_used_today + live.seconds_remaining_today) / 60;
      document.getElementById("live-budget").textContent =
        "Live audio budget today: " + (live.seconds_used_today / 60).toFixed(1) + " of " +
        budget.toFixed(1) + " minutes used (Live sleeps once the budget runs out).";
    }
    function renderJobs(jobs) {
      const body = document.getElementById("jobs");
      const existingRows = Array.from(body.querySelectorAll("tr"));
      const seen = new Set();
      jobs.forEach(job => {
        let row = existingRows.find(candidate => candidate.dataset.jobId === job.id);
        if (!row) {
          row = createJobRow(job);
        }
        updateJobRow(row, job);
        body.appendChild(row);
        seen.add(job.id);
      });
      existingRows.forEach(row => {
        if (!seen.has(row.dataset.jobId)) {
          row.remove();
        }
      });
    }
    async function refresh() {
      renderNav();
      const status = await (await fetch("/api/status")).json();
      renderLive(status.live);
      if (currentPage() === "jobs") {
        renderJobs(status.jobs);
      } else {
        renderCosts(await (await fetch("/api/costs")).json());
      }
    }
    window.addEventListener("hashchange", refresh);
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
