[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-device-sdk"
dynamic = ["version"]
description = "Device connector interface for ambient-home"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "ambient_device_sdk._version.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ambient_device_sdk = ["py.typed"]
